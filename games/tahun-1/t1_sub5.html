    <script>

        // Copy compatible records from the old game database once.
        (() => {
            const key = 'edukidz_t1_sub5_users';
            if (localStorage.getItem(key) !== null) return;
            const read = name => {
                try { return JSON.parse(localStorage.getItem(name)); } catch { return null; }
            };
            const legacy = read('edukidz_users');
            const users = Array.isArray(legacy)
                ? legacy.filter(u => u && typeof u.username === "string" && typeof u.nama === "string" && Number.isFinite(u.totalSoalanDijawab) && Number.isFinite(u.totalMarkah))
                : [];
            localStorage.setItem(key, JSON.stringify(users));
        })();

        // Web Audio API untuk kesan bunyi ceria tanpa fail luar
        class SoundFX {
            constructor() {
                this.enabled = true;
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playCorrect() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.5);
            }
            playWrong() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(220, now);
                osc.frequency.setValueAtTime(180, now + 0.15);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
            playClick() {
                if (!this.enabled) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }
        }

        const sound = new SoundFX();

        // Bank Soalan Komprehensif: 300 Soalan Unik (5 Topik x 3 Tahap x 20 Soalan)
        class BankSoalanManager {
            constructor() {
                this.soalanList = [];
                this.janaSemuaSoalan();
            }

            janaSemuaSoalan() {
                const topikNama = [
                    "Kenali Jam dan Masa",
                    "Padankan Gambarajah Jarum Jam dan Minit",
                    "Kenali Hari, Minggu dan Bulan",
                    "Lengkapkan Ayat Matematik Berdasarkan Gambar",
                    "Soalan Penyelesaian Masalah"
                ];

                const tahapList = ["Senang", "Sederhana", "Susah"];
                const arasKognitifList = {
                    "Senang": ["Mengingat", "Memahami"],
                    "Sederhana": ["Memahami", "Mengaplikasi"],
                    "Susah": ["Mengaplikasi"]
                };

                topikNama.forEach((topik, tIndex) => {
                    tahapList.forEach((tahap, thIndex) => {
                        for (let i = 1; i <= 20; i++) {
                            let qId = `MASA-${tIndex+1}-${thIndex+1}-${String(i).padStart(3, '0')}`;
                            let gameTypeOptions = ["objektif", "isitempat", "padanan", "dragdrop"];
                            let gType = gameTypeOptions[(i + tIndex + thIndex) % gameTypeOptions.length];
                            if (tIndex === 2) gType = (i % 2 === 0) ? "objektif" : "isitempat";
                            if (tIndex === 4) gType = "objektif";

                            let generated = this.binaSoalanUnik(tIndex + 1, tahap, i);
                            this.soalanList.push({
                                questionId: qId,
                                topicId: tIndex + 1,
                                topicName: topik,
                                difficulty: tahap,
                                cognitiveLevel: arasKognitifList[tahap][i % arasKognitifList[tahap].length],
                                gameType: gType,
                                question: generated.question,
                                imageType: generated.imageType,
                                imageDetails: generated.imageDetails,
                                options: generated.options,
                                correctAnswer: generated.correctAnswer,
                                marks: 5
                            });
                        }
                    });
                });
            }

            binaSoalanUnik(topikId, tahap, index) {
                const level = ['Senang', 'Sederhana', 'Susah'].indexOf(tahap);
                const step = index - 1;
                const hour = step % 12 + 1;
                const pairs = [[0, 30], [15, 45], [5, 10]];
                const minute = pairs[level][Math.floor(step / 12)];
                const time = (h, m) => `${h}:${String(m).padStart(2, '0')}`;
                const shiftHour = delta => (hour - 1 + delta + 12) % 12 + 1;
                const analog = { jam: hour, minit: minute };
                const make = (question, answer, wrong, imageType = 'none', imageDetails = null) => ({
                    question, imageType, imageDetails,
                    options: this.acakPilihan([answer, ...wrong]), correctAnswer: answer
                });

                if (topikId === 1) {
                    return make('Baca jam analog ini. Pukul berapakah sekarang?', time(hour, minute),
                        [time(shiftHour(1), minute), time(hour, (minute + 15) % 60), time(hour, (minute + 30) % 60)],
                        'analog', analog);
                }
                if (topikId === 2) {
                    const clock = { jam: hour, minit: [20, 25, 35, 40, 50, 55][level * 2 + Math.floor(step / 12)] };
                    if (level === 0) {
                        const answer = clock.minit / 5;
                        return make('Pada angka berapakah jarum panjang menunjuk?', String(answer),
                            [answer - 1, answer + 1, answer + 2].map(String), 'analog', clock);
                    }
                    if (level === 1) {
                        return make('Berapa minit ditunjukkan oleh jarum panjang?', `${clock.minit} minit`,
                            [clock.minit - 5, clock.minit + 5, clock.minit + 10].map(m => `${m} minit`), 'analog', clock);
                    }
                    return make('Di antara dua angka, apakah angka terakhir yang telah dilalui oleh jarum pendek?', String(hour),
                        [1, 2, 3].map(delta => String(shiftHour(delta))), 'analog', clock);
                }
                if (topikId === 3) {
                    const days = ['Isnin', 'Selasa', 'Rabu', 'Khamis', 'Jumaat', 'Sabtu', 'Ahad'];
                    const months = ['Januari', 'Februari', 'Mac', 'April', 'Mei', 'Jun', 'Julai', 'Ogos', 'September', 'Oktober', 'November', 'Disember'];
                    const isDay = step < 7;
                    const calendar = isDay ? days : months;
                    const start = isDay ? step : (step - 7) % 12;
                    const delta = (level === 0 ? 1 : level === 1 ? -1 : 2) * (step === 19 ? 3 : 1);
                    const number = Math.abs(delta);
                    const unit = isDay ? 'hari' : 'bulan';
                    const action = delta > 0 ? 'selepas' : 'sebelum';
                    const end = (start + delta + calendar.length) % calendar.length;
                    return make(`Apakah ${unit} ${number} ${unit} ${action} ${calendar[start]}?`, calendar[end],
                        [1, 2, 3].map(offset => calendar[(end + offset) % calendar.length]), 'kalendar', { text: calendar[start] });
                }
                if (topikId === 4) {
                    const pictureMinute = [0, 30, 15, 45, 5, 10][level * 2 + Math.floor(step / 12)];
                    return make(`Lengkapkan ayat berdasarkan gambar: Jam menunjukkan pukul ${hour}:____.`,
                        String(pictureMinute).padStart(2, '0'),
                        [5, 15, 30].map(delta => String((pictureMinute + delta) % 60).padStart(2, '0')),
                        'analog', { jam: hour, minit: pictureMinute });
                }
                const names = ['Ali', 'Aina', 'Siti', 'Kumar', 'Mei Ling'];
                const activity = ['membaca buku', 'melukis', 'membuat latihan', 'bermain congkak'][Math.floor(step / 5)];
                const starts = [7, 8, 9, 10, 11];
                const start = (starts[step % 5] + level * 2) % 12 || 12;
                const startMin = level === 0 ? 0 : 30;
                const duration = level === 0 ? 60 : level === 1 ? 30 : 60;
                const end = start % 12 * 60 + startMin + duration;
                const endHour = Math.floor(end / 60) % 12 || 12;
                const endMin = end % 60;
                return make(`${names[step % 5]} mula ${activity} pada pukul ${time(start, startMin)} selama ${duration === 60 ? 'satu jam' : 'setengah jam'}. Pukul berapakah aktiviti itu selesai?`,
                    time(endHour, endMin),
                    [time(endHour % 12 + 1, endMin), time(endHour, (endMin + 30) % 60), time(start, startMin)],
                    'analog', { jam: start, minit: startMin });
            }

            acakPilihan(array) {
                return [...array].sort(() => Math.random() - 0.5);
            }

            getSoalanByTopikTahap(topicId, difficulty) {
                let filtered = this.soalanList.filter(s => s.topicId === Number(topicId) && s.difficulty === difficulty);
                return [...filtered].sort(() => Math.random() - 0.5).slice(0, 20);
            }
        }

        const bankSoalan = new BankSoalanManager();

        // State Aplikasi & Pengurusan Akaun Lokal (LocalStorage)
        class EduKidzApp {
            constructor() {
                this.currentUser = null;
                this.users = JSON.parse(localStorage.getItem('edukidz_t1_sub5_users')) || [];
                this.currentView = 'auth'; // auth, menu, topik, tahap, mod, masa, permainan, keputusan, progress, leaderboard, tetapan
                this.selectedTopic = null;
                this.selectedDifficulty = null;
                this.selectedGameMode = null;
                this.selectedTimeLimit = 30; // 30 saat, 60 saat, atau 0 (tiada had)
                
                // State Semasa Permainan
                this.activeQuestions = [];
                this.currentIndex = 0;
                this.answeredCurrent = false;
                this.score = 0;
                this.correctCount = 0;
                this.wrongCount = 0;
                this.unansweredCount = 0;
                this.timerInterval = null;
                this.timeLeft = 30;
                this.userAnswersRecord = [];

                this.init();
            }

            init() {
                this.render();
            }

            simpanDatabase() {
                localStorage.setItem('edukidz_t1_sub5_users', JSON.stringify(this.users));
            }

            // --- Fungsi Paparan & Navigasi ---
            render() {
                const container = document.getElementById('app-container');
                const userInfoBar = document.getElementById('user-info-bar');

                if (this.currentUser) {
                    userInfoBar.classList.remove('hidden');
                    userInfoBar.classList.add('flex');
                    document.getElementById('current-user-display').innerText = `👋 ${this.currentUser.nama}`;
                } else {
                    userInfoBar.classList.remove('flex');
                    userInfoBar.classList.add('hidden');
                }

                if (!this.currentUser && this.currentView !== 'auth') {
                    this.currentView = 'auth';
                }

                switch(this.currentView) {
                    case 'auth':
                        container.innerHTML = this.renderAuthHTML();
                        break;
                    case 'menu':
                        container.innerHTML = this.renderMenuHTML();
                        break;
                    case 'topik':
                        container.innerHTML = this.renderTopikHTML();
                        break;
                    case 'tahap':
                        container.innerHTML = this.renderTahapHTML();
                        break;
                    case 'mod':
                        container.innerHTML = this.renderModHTML();
                        break;
                    case 'masa':
                        container.innerHTML = this.renderMasaHTML();
                        break;
                    case 'permainan':
                        container.innerHTML = this.renderPermainanHTML();
                        this.mulakanTimerSoalan();
                        break;
                    case 'keputusan':
                        container.innerHTML = this.renderKeputusanHTML();
                        break;
                    case 'progress':
                        container.innerHTML = this.renderProgressHTML();
                        break;
                    case 'leaderboard':
                        container.innerHTML = this.renderLeaderboardHTML();
                        break;
                    case 'tetapan':
                        container.innerHTML = this.renderTetapanHTML();
                        break;
                }
            }

            // --- AUTENTIKASI ---
            renderAuthHTML() {
                return `
                    <div class="text-center max-w-md mx-auto py-4">
                        <div class="inline-block p-4 bg-amber-100 rounded-3xl mb-3 shadow-inner">
                            <span class="text-5xl">⏰👦👧</span>
                        </div>
                        <h2 class="font-fredoka text-3xl font-bold text-amber-600 mb-1">EDU KIDZ</h2>
                        <p class="text-slate-600 text-sm mb-6 font-medium">Matematik Tahun 1 – Masa dan Waktu<br><span class="text-rose-500 font-bold">"Belajar Masa, Jadi Hebat!"</span></p>
                        
                        <div class="flex bg-amber-50 p-1.5 rounded-2xl mb-6 border border-amber-200">
                            <button id="tab-login-btn" onclick="app.switchAuthTab('login')" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white text-amber-600 shadow-sm">Login Akaun</button>
                            <button id="tab-daftar-btn" onclick="app.switchAuthTab('daftar')" class="flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-500 hover:text-amber-600">Daftar Baru</button>
                        </div>

                        <!-- Borang Login -->
                        <div id="form-login" class="space-y-4 text-left">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">NAMA PENGGUNA</label>
                                <input type="text" id="login-username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium text-sm" placeholder="cth: aiman123">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">KATA LALUAN</label>
                                <input type="password" id="login-password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-amber-400 font-medium text-sm" placeholder="••••••••">
                            </div>
                            <button onclick="app.prosesLogin()" class="w-full py-3.5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white font-bold rounded-xl shadow-lg transform active:scale-95 transition text-base">
                                🚀 MASUK SEKARANG
                            </button>
                        </div>

                        <!-- Borang Daftar -->
                        <div id="form-daftar" class="space-y-4 text-left hidden">
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">NAMA PENUH MURID</label>
                                <input type="text" id="daftar-nama" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-400 font-medium text-sm" placeholder="cth: Aiman Hakim">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">NAMA PENGGUNA UNIK</label>
                                <input type="text" id="daftar-username" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-400 font-medium text-sm" placeholder="cth: aiman123">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-slate-600 mb-1">KATA LALUAN</label>
                                <input type="password" id="daftar-password" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-rose-400 font-medium text-sm" placeholder="••••••••">
                            </div>
                            <button onclick="app.prosesDaftar()" class="w-full py-3.5 bg-gradient-to-r from-rose-400 to-rose-500 hover:from-rose-500 hover:to-rose-600 text-white font-bold rounded-xl shadow-lg transform active:scale-95 transition text-base">
                                ✨ DAFTAR AKAUN BARU
                            </button>
                        </div>
                        <div id="auth-msg" class="mt-4 text-xs font-bold text-rose-600"></div>
                    </div>
                `;
            }

            switchAuthTab(tab) {
                sound.playClick();
                const lForm = document.getElementById('form-login');
                const dForm = document.getElementById('form-daftar');
                const lBtn = document.getElementById('tab-login-btn');
                const dBtn = document.getElementById('tab-daftar-btn');
                const msg = document.getElementById('auth-msg');
                msg.innerText = '';

                if (tab === 'login') {
                    lForm.classList.remove('hidden');
                    dForm.classList.add('hidden');
                    lBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white text-amber-600 shadow-sm";
                    dBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-500 hover:text-amber-600";
                } else {
                    lForm.classList.add('hidden');
                    dForm.classList.remove('hidden');
                    dBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition bg-white text-rose-600 shadow-sm";
                    lBtn.className = "flex-1 py-2.5 rounded-xl font-bold text-sm transition text-slate-500 hover:text-rose-600";
                }
            }

            prosesLogin() {
                sound.playClick();
                const u = document.getElementById('login-username').value.trim();
                const p = document.getElementById('login-password').value.trim();
                const msg = document.getElementById('auth-msg');

                if (!u || !p) {
                    msg.innerText = "Sila isi nama pengguna dan kata laluan!";
                    return;
                }

                const found = this.users.find(x => x.username === u && x.password === p);
                if (found) {
                    this.currentUser = found;
                    this.currentView = 'menu';
                    this.render();
                } else {
                    msg.innerText = "Nama pengguna atau kata laluan tidak sah!";
                }
            }

            prosesDaftar() {
                sound.playClick();
                const nama = document.getElementById('daftar-nama').value.trim();
                const u = document.getElementById('daftar-username').value.trim();
                const p = document.getElementById('daftar-password').value.trim();
                const msg = document.getElementById('auth-msg');

                if (!nama || !u || !p) {
                    msg.innerText = "Sila lengkapkan semua medan pendaftaran!";
                    return;
                }

                if (this.users.some(x => x.username === u)) {
                    msg.innerText = "Nama pengguna telah wujud! Sila guna nama lain.";
                    return;
                }

                const newUser = {
                    nama: nama,
                    username: u,
                    password: p,
                    totalSoalanDijawab: 0,
                    totalBetul: 0,
                    totalSalah: 0,
                    totalMarkah: 0,
                    skorTertinggi: 0,
                    topikSelesai: [],
                    tahapSelesai: [],
                    lencana: []
                };

                this.users.push(newUser);
                this.simpanDatabase();
                this.currentUser = newUser;
                this.currentView = 'menu';
                this.render();
            }

            logKeluar() {
                sound.playClick();
                this.currentUser = null;
                this.currentView = 'auth';
                this.render();
            }

            renderMenuHTML() {
                return `

                        <div class="mb-4">
                            <span class="inline-block px-4 py-1.5 bg-amber-100 text-amber-800 rounded-full font-bold text-sm border border-amber-200">
                                Selamat datang, ${this.currentUser.nama}! 👋
                            </span>
                        </div>
                        <h2 class="font-fredoka text-3xl font-bold text-slate-800 mb-2">MENU UTAMA EDU KIDZ</h2>
                        <p class="text-slate-500 text-sm mb-6">Pilih aktiviti pembelajaran seronok di bawah:</p>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-xl mx-auto">
                            <button onclick="app.navigasiKeTopik()" class="p-5 bg-gradient-to-r from-amber-400 to-amber-500 hover:from-amber-500 hover:to-amber-600 text-white rounded-2xl shadow-lg font-bold text-lg flex items-center justify-center space-x-3 transform active:scale-95 transition">
                                <span class="text-2xl">🎮</span>

            // --- PERMAINAN UTAMA ---
            mulakanTimerSoalan() {
                if (this.timerInterval) clearInterval(this.timerInterval);
                if (this.selectedTimeLimit <= 0) return;

                this.timeLeft = this.selectedTimeLimit;
                const timerBar = document.getElementById('timer-bar');
                const timerText = document.getElementById('timer-text');

                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    if (timerText) timerText.innerText = this.timeLeft;
                    if (timerBar) {
                        let pct = (this.timeLeft / this.selectedTimeLimit) * 100;
                        timerBar.style.width = pct + '%';
                    }

                    if (this.timeLeft <= 0) {
                        clearInterval(this.timerInterval);
                        this.semakJawapan(null, true); // Masa tamat
                    }
                }, 1000);
            }

                                    const x = 50 + Math.sin(angle) * 41;
                                    const y = 50 - Math.cos(angle) * 41;

                                🎒 Aktiviti: ${q.imageDetails.aktiviti}
                            </div>
                        </div>
                    `;
                } else if (q.imageType === 'wang_jam') {
                    gambarHTML = `
                        <div class="my-4 flex justify-center space-x-2">
                            <div class="px-3 py-1.5 bg-emerald-100 text-emerald-800 font-bold rounded-xl border border-emerald-200 text-xs">💵 ${q.imageDetails.wang}</div>

                    `;
                }

                let timerDisplayHTML = this.selectedTimeLimit > 0 ? `
                    <div class="flex justify-between items-center mb-4 bg-amber-50 px-4 py-2 rounded-xl border border-amber-200">

                        </div>
                    </div>
                ` : '';

                // Memastikan q.options sentiasa wujud & mempunyai pilihan jawapan selamat
                const safeOptions = (q && q.options && q.options.length > 0) 
                    ? q.options 
                    : [q.correctAnswer, "Pilihan A", "Pilihan B", "Pilihan C"].sort(() => Math.random() - 0.5);

                return `

                            ${safeOptions.map((opt, idx) => `
                                <button onclick="app.semakJawapan('${String(opt).replace(/'/g, "\\'")}')" class="p-4 bg-white hover:bg-amber-50 border-2 border-amber-200 rounded-2xl font-bold text-slate-700 text-sm shadow-sm transition transform active:scale-95 text-center flex items-center justify-center">

            }

            semakJawapan(pilihanMurid, isTimeout = false) {
                const questions = this.activeQuestions;
                const q = questions[this.currentIndex];
                if (!q || this.answeredCurrent || this.currentView !== 'permainan') return;
                this.answeredCurrent = true;
                if (this.timerInterval) clearInterval(this.timerInterval);
                const feedbackBox = document.getElementById('feedback-box');
                const optionsGrid = document.getElementById('options-grid');

                // Nyahdayakan butang pilihan selepas menjawab
                if (optionsGrid) {
                    const buttons = optionsGrid.getElementsByTagName('button');
                    for (let btn of buttons) btn.disabled = true;
                }

                let isCorrect = false;
                if (!isTimeout && pilihanMurid === q.correctAnswer) {
                    isCorrect = true;
                    this.score += 5;
                    this.correctCount++;
                    sound.playCorrect();
                    if (feedbackBox) {
                        feedbackBox.className = "text-center p-4 rounded-2xl font-bold text-sm mt-4 bg-emerald-100 text-emerald-800 border-2 border-emerald-300 animate-bounce-slow";
                        feedbackBox.innerHTML = `🎉 Syabas! Jawapan kamu betul! (+5 markah)`;
                    }
                } else {
                    this.wrongCount++;
                    if (isTimeout) this.unansweredCount++;
                    sound.playWrong();
                    if (feedbackBox) {
                        feedbackBox.className = "text-center p-4 rounded-2xl font-bold text-sm mt-4 bg-rose-100 text-rose-800 border-2 border-rose-300";
                        feedbackBox.innerHTML = isTimeout ? `⏰ Masa sudah tamat! <br>✅ Jawapan yang betul ialah: <b>${q.correctAnswer}</b>` : `❌ Cuba lagi! <br>✅ Jawapan yang betul ialah: <b>${q.correctAnswer}</b>`;
                    }
                }

                if (feedbackBox) {
                    feedbackBox.classList.remove('hidden');
                }
                this.userAnswersRecord.push({ soal: q.question, dipilih: pilihanMurid, betul: q.correctAnswer, status: isCorrect });

                // Teruskan ke soalan seterusnya selepas 1.5 saat
                setTimeout(() => {
                    if (this.activeQuestions !== questions || this.currentView !== 'permainan') return;
                    this.currentIndex++;
                    this.answeredCurrent = false;
                    if (this.currentIndex >= this.activeQuestions.length) {
                        this.tamatPermainan();
                    } else {
                        this.render();
                    }
                }, 1500);
            }

            tamatPermainan() {
                if (this.currentView === 'keputusan' || this.currentIndex !== this.activeQuestions.length) return;
                if (this.timerInterval) clearInterval(this.timerInterval);

                // Pastikan nilai skor adalah nombor yang sah
                this.score = Number(this.score) || 0;

                // Kemaskini statistik akaun pengguna semasa
                if (this.currentUser) {
                    this.currentUser.totalSoalanDijawab += this.activeQuestions.length;
                    this.currentUser.totalBetul += this.correctCount;
                    this.currentUser.totalSalah += this.wrongCount;
                    
                    this.currentUser.totalMarkah = (Number(this.currentUser.totalMarkah) || 0) + this.score;

                    if (this.score > (this.currentUser.skorTertinggi || 0)) {
                        this.currentUser.skorTertinggi = this.score;
                    }

                    if (!this.currentUser.topikSelesai.includes(this.selectedTopic)) {
                        this.currentUser.topikSelesai.push(this.selectedTopic);
                    }
                    if (!this.currentUser.tahapSelesai.includes(this.selectedDifficulty)) {
                        this.currentUser.tahapSelesai.push(this.selectedDifficulty);
                    }

                    // Kemaskini lencana pencapaian
                    if (this.currentUser.totalBetul >= 10 && !this.currentUser.lencana.includes('🏅 Jam Hebat')) {
                        this.currentUser.lencana.push('🏅 Jam Hebat');
                    }
                    if (this.currentUser.totalBetul >= 30 && !this.currentUser.lencana.includes('🏅 Pakar Masa')) {
                        this.currentUser.lencana.push('🏅 Pakar Masa');
                    }
                    if (this.currentUser.topikSelesai.length >= 3 && !this.currentUser.lencana.includes('🏅 Juara Kalendar')) {
                        this.currentUser.lencana.push('🏅 Juara Kalendar');
                    }
                    if (this.score === 100 && !this.currentUser.lencana.includes('🏆 Master Masa')) {
                        this.currentUser.lencana.push('🏆 Master Masa');
                    }

                    this.simpanDatabase();
                }

                this.currentView = 'keputusan';
                this.render();
            }

            // --- PAPARAN KEPUTUSAN PERMAINAN ---
            renderKeputusanHTML() {
                const totalQ = (this.activeQuestions && this.activeQuestions.length) ? this.activeQuestions.length : 20;
                const finalScore = Number(this.score) || 0;
                const peratus = Math.round((this.correctCount / totalQ) * 100);

                let mesejPencapaian = "";
                let ikonPencapaian = "🏆";

                if (finalScore >= 90) {
                    mesejPencapaian = "Hebat! Kamu memang Juara Masa!";
                    ikonPencapaian = "🏆";
                } else if (finalScore >= 70) {
                    mesejPencapaian = "Bagus! Teruskan berlatih!";
                    ikonPencapaian = "🌟";
                } else if (finalScore >= 50) {
                    mesejPencapaian = "Bagus! Cuba lagi untuk skor lebih tinggi!";
                    ikonPencapaian = "👍";
                } else {
                    mesejPencapaian = "Jangan putus asa! Mari cuba lagi!";
                    ikonPencapaian = "💪";
                }

                const totalUserMarkah = this.currentUser ? (Number(this.currentUser.totalMarkah) || finalScore) : finalScore;

                return `
                    <div class="text-center max-w-lg mx-auto py-2">
                        <div class="text-5xl mb-2 animate-bounce-slow">${ikonPencapaian}</div>
                        <h2 class="font-fredoka text-3xl font-bold text-amber-600 mb-1">PERMAINAN TAMAT!</h2>
                        <p class="text-slate-600 font-bold text-base mb-4">${mesejPencapaian}</p>

                        <!-- Kad Skor Utama (Markah Keseluruhan Set Ini) -->
                        <div class="bg-gradient-to-br from-amber-100 to-amber-200 border-4 border-amber-300 rounded-3xl p-6 shadow-md mb-6">
                            <div class="text-xs font-extrabold tracking-wider text-amber-800 uppercase mb-1">MARKAH KESELURUHAN SET INI</div>
                            <div class="font-fredoka text-6xl font-extrabold text-amber-600 drop-shadow-sm mb-2">
                                ${finalScore} <span class="text-2xl font-bold text-slate-600">/ 100</span>
                            </div>
                            <div class="inline-block bg-white text-slate-700 text-xs font-bold px-4 py-1.5 rounded-full border border-amber-300 shadow-sm">
                                Ketepatan Jawapan: <span class="text-emerald-600 font-extrabold">${peratus}%</span>
                            </div>
                        </div>

                        <!-- Ringkasan Statistik -->
                        <div class="grid grid-cols-3 gap-3 mb-6">
                            <div class="p-3 bg-emerald-50 border border-emerald-200 rounded-2xl">
                                <div class="text-xs font-bold text-emerald-700">BETUL</div>
                                <div class="font-fredoka text-xl font-bold text-emerald-800">${this.correctCount} / ${totalQ}</div>
                            </div>
                            <div class="p-3 bg-rose-50 border border-rose-200 rounded-2xl">
                                <div class="text-xs font-bold text-rose-700">SALAH</div>
                                <div class="font-fredoka text-xl font-bold text-rose-800">${this.wrongCount}</div>
                            </div>
                            <div class="p-3 bg-purple-50 border border-purple-200 rounded-2xl">
                                <div class="text-xs font-bold text-purple-700">JUMLAH AKAUN</div>
                                <div class="font-fredoka text-xl font-bold text-purple-800">${totalUserMarkah} pts</div>
                            </div>
                        </div>

                        <!-- Butang Tindakan -->
                        <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                            <button onclick="app.mulakanPermainanAktif(app.selectedTimeLimit)" class="p-3 bg-amber-500 hover:bg-amber-600 text-white font-bold text-xs rounded-xl transition shadow">
                                🔄 MAIN LAGI
                            </button>
                            <button onclick="app.navigasiKeMenu()" class="p-3 bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs rounded-xl transition shadow">
                                🏠 MENU UTAMA
                            </button>
                            <button onclick="app.bukaProgress()" class="p-3 bg-purple-500 hover:bg-purple-600 text-white font-bold text-xs rounded-xl transition shadow">
                                📊 PROGRESS
                            </button>
                            <button onclick="app.bukaLeaderboard()" class="p-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-xl transition shadow">
                                🏆 RANKING
                            </button>
                        </div>
                    </div>
                `;
            }

            // --- PAPARAN PROGRESS SAYA ---
            bukaProgress() {
                sound.playClick();
                this.currentView = 'progress';
                this.render();
            }

            renderProgressHTML() {
                if (!this.currentUser) return '';
                const u = this.currentUser;

                const lencanaList = u.lencana && u.lencana.length > 0 ? u.lencana : ['Belum ada lencana lagi. Mari bermain!'];

                return `
                    <div class="max-w-md mx-auto">
                        <button onclick="app.navigasiKeMenu()" class="mb-4 text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-xl transition inline-flex items-center space-x-1">
                            <span>← Kembali ke Menu</span>
                        </button>
                        <h2 class="font-fredoka text-2xl font-bold text-slate-800 mb-1 text-center">📊 PROGRESS SAYA</h2>
                        <p class="text-slate-500 text-xs text-center mb-6">Rekod pencapaian peribadi ${u.nama}</p>

                        <div class="bg-white border-2 border-amber-200 rounded-2xl p-4 shadow-sm mb-4 space-y-3">
                            <div class="flex justify-between border-b pb-2 text-sm">
                                <span class="text-slate-500 font-medium">Jumlah Soalan Dijawab:</span>
                                <span class="font-bold text-amber-600">${u.totalSoalanDijawab}</span>
                            </div>
                            <div class="flex justify-between border-b pb-2 text-sm">
                                <span class="text-slate-500 font-medium">Jumlah Jawapan Betul:</span>
                                <span class="font-bold text-emerald-600">${u.totalBetul}</span>
                            </div>
                            <div class="flex justify-between border-b pb-2 text-sm">
                                <span class="text-slate-500 font-medium">Jumlah Jawapan Salah:</span>
                                <span class="font-bold text-rose-600">${u.totalSalah}</span>
                            </div>
                            <div class="flex justify-between border-b pb-2 text-sm">
                                <span class="text-slate-500 font-medium">Jumlah Markah Terkumpul:</span>
                                <span class="font-bold text-purple-600">${u.totalMarkah} pts</span>
                            </div>
                            <div class="flex justify-between text-sm">
                                <span class="text-slate-500 font-medium">Skor Tertinggi Set:</span>
                                <span class="font-bold text-amber-600">${u.skorTertinggi} / 100</span>
                            </div>
                        </div>

                        <h3 class="font-fredoka text-base font-bold text-slate-800 mb-2">🎖️ Lencana Pencapaian:</h3>
                        <div class="flex flex-wrap gap-2 mb-6">
                            ${lencanaList.map(l => `<span class="px-3 py-1.5 bg-amber-100 text-amber-800 text-xs font-bold rounded-full border border-amber-300 shadow-sm">${l}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            // --- PAPARAN LEADERBOARD ---
            bukaLeaderboard() {
                sound.playClick();
                this.currentView = 'leaderboard';
                this.render();
            }

            renderLeaderboardHTML() {
                const sorted = [...this.users].sort((a, b) => b.totalMarkah - a.totalMarkah);

                return `
                    <div class="max-w-md mx-auto">
                        <button onclick="app.navigasiKeMenu()" class="mb-4 text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-xl transition inline-flex items-center space-x-1">
                            <span>← Kembali ke Menu</span>
                        </button>
                        <h2 class="font-fredoka text-2xl font-bold text-slate-800 mb-1 text-center">🏆 LEADERBOARD</h2>
                        <p class="text-slate-500 text-xs text-center mb-6">Kedudukan markah tertinggi pemain Edu Kidz</p>

                        <div class="space-y-2">
                            ${sorted.length === 0 ? '<p class="text-center text-xs text-slate-400">Belum ada rekod pemain.</p>' : ''}
                            ${sorted.map((usr, idx) => {
                                let medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `#${idx + 1}`;
                                let isCurrent = this.currentUser && this.currentUser.username === usr.username;
                                return `
                                    <div class="p-3 ${isCurrent ? 'bg-amber-100 border-2 border-amber-400' : 'bg-white border border-slate-200'} rounded-2xl flex items-center justify-between shadow-sm">
                                        <div class="flex items-center space-x-3">
                                            <span class="font-bold text-lg w-8 text-center">${medal}</span>
                                            <div>
                                                <div class="font-bold text-sm text-slate-800">${usr.nama} ${isCurrent ? '(Saya)' : ''}</div>
                                                <div class="text-[10px] text-slate-500">@${usr.username}</div>
                                            </div>
                                        </div>
                                        <div class="font-fredoka font-bold text-amber-600 text-base">
                                            ${usr.totalMarkah} <span class="text-xs text-slate-400 font-normal">pts</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }

            // --- PAPARAN TETAPAN ---
            bukaTetapan() {
                sound.playClick();
                this.currentView = 'tetapan';
                this.render();
            }

            renderTetapanHTML() {
                return `
                    <div class="max-w-md mx-auto text-center">
                        <button onclick="app.navigasiKeMenu()" class="mb-4 text-xs font-bold text-amber-600 bg-amber-50 hover:bg-amber-100 px-4 py-2 rounded-xl transition inline-flex items-center space-x-1">
                            <span>← Kembali ke Menu</span>
                        </button>
                        <h2 class="font-fredoka text-2xl font-bold text-slate-800 mb-1">⚙️ TETAPAN APLIKASI</h2>
                        <p class="text-slate-500 text-xs mb-6">Laraskan tetapan audio dan permainan:</p>

                        <div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-4 mb-6">
                            <div class="flex items-center justify-between">
                                <span class="font-bold text-sm text-slate-700">Kesan Bunyi (Sound FX)</span>
                                <button onclick="sound.enabled = !sound.enabled; app.render();" class="px-4 py-2 rounded-xl font-bold text-xs ${sound.enabled ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'} transition">
                                    ${sound.enabled ? '🔊 AKTIF' : '🔇 MATI'}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // Mulakan aplikasi sebaik sahaja halaman siap dimuatkan
        let app;
        window.onload = function() {
            app = new EduKidzApp();
        };
    </script>
</body>
</html>
